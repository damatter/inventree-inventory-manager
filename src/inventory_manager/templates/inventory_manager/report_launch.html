<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generating Stock Entry Report</title>
    <style>
        :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #263746; background: #f3f6f8; }
        * { box-sizing: border-box; }
        body { margin: 0; }
        .shell { display: grid; min-height: 100vh; padding: 20px; place-items: center; }
        .card { width: min(600px, 100%); padding: 36px; border: 1px solid #d7dde2; border-radius: 12px; background: #fff; box-shadow: 0 3px 14px rgb(35 52 66 / 9%); text-align: center; }
        .spinner { width: 46px; height: 46px; margin: 0 auto 20px; border: 5px solid #dce6df; border-top-color: #26734d; border-radius: 50%; animation: spin .9s linear infinite; }
        .error-icon { display: none; width: 50px; height: 50px; margin: 0 auto 20px; border-radius: 50%; color: #fff; background: #a32f2f; font-size: 29px; font-weight: 800; place-items: center; }
        h1 { margin: 0 0 10px; font-size: 26px; }
        p { margin: 0 0 18px; color: #687681; line-height: 1.5; }
        .period { color: #31495b; font-weight: 700; }
        .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
        .button { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 10px 18px; border: 0; border-radius: 8px; color: #fff; background: #176b78; font: inherit; font-weight: 750; text-decoration: none; cursor: pointer; }
        .button.secondary { color: #263f51; background: #e5ebef; }
        .noscript { margin-top: 24px; padding-top: 18px; border-top: 1px solid #d7dde2; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 500px) { .card { padding: 28px 20px; } .actions { flex-direction: column; } }
    </style>
</head>
<body>
<main class="shell">
    <section class="card" aria-live="polite">
        <div id="spinner" class="spinner" aria-hidden="true"></div>
        <div id="error-icon" class="error-icon" aria-hidden="true">!</div>
        <h1 id="status-title">Generating your stock-entry report</h1>
        <p id="status-message">The report is running now. Larger date ranges can take several minutes; this page will open the PDF as soon as it is ready.</p>
        <p class="period">{{ period_start }} through {{ period_end }}</p>

        <form id="generation-form" method="post" action="{{ control_panel_url }}">
            {% csrf_token %}
            <input type="hidden" name="action" value="generate-stock-entry-report">
            <input type="hidden" name="period_start" value="{{ period_start }}">
            <input type="hidden" name="period_end" value="{{ period_end }}">
        </form>

        <div class="actions">
            <a class="button secondary" href="{{ control_panel_url }}">Return to Reporting</a>
            <button id="retry" class="button" type="button" hidden>Try again</button>
        </div>

        <noscript>
            <form class="noscript" method="post" action="{{ control_panel_url }}">
                {% csrf_token %}
                <input type="hidden" name="action" value="generate-stock-entry-report">
                <input type="hidden" name="generation_mode" value="direct">
                <input type="hidden" name="period_start" value="{{ period_start }}">
                <input type="hidden" name="period_end" value="{{ period_end }}">
                <p>JavaScript is disabled, so automatic progress updates are unavailable.</p>
                <button class="button" type="submit">Generate without progress updates</button>
            </form>
        </noscript>
    </section>
</main>
<script>
    (function () {
        "use strict";

        var form = document.getElementById("generation-form");
        var spinner = document.getElementById("spinner");
        var errorIcon = document.getElementById("error-icon");
        var title = document.getElementById("status-title");
        var message = document.getElementById("status-message");
        var retry = document.getElementById("retry");

        function showError(detail) {
            spinner.style.display = "none";
            errorIcon.style.display = "grid";
            title.textContent = "Report could not be generated";
            message.textContent = detail || "InvenTree could not generate this report. Return to Reporting or try again.";
            retry.hidden = false;
            document.title = "Report Error";
        }

        function generate() {
            spinner.style.display = "block";
            errorIcon.style.display = "none";
            retry.hidden = true;
            title.textContent = "Generating your stock-entry report";
            message.textContent = "The report is running now. Larger date ranges can take several minutes; this page will open the PDF as soon as it is ready.";

            window.fetch(form.action, {
                method: "POST",
                body: new FormData(form),
                credentials: "same-origin",
                cache: "no-store",
                headers: {"Accept": "application/json"}
            }).then(function (response) {
                return response.json().catch(function () { return {}; }).then(function (data) {
                    if (!response.ok) {
                        throw new Error(data.error || "Report generation failed.");
                    }
                    return data;
                });
            }).then(function (data) {
                if (!data.status_url) {
                    throw new Error("InvenTree did not return a report job.");
                }
                window.location.assign(data.status_url);
            }).catch(function (error) {
                showError(error.message);
            });
        }

        retry.addEventListener("click", generate);
        generate();
    }());
</script>
</body>
</html>
