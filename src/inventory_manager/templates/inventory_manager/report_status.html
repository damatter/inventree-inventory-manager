<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="2">
    <title>Generating Report</title>
    <style>
        :root {
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #263746;
            background: #f3f5f7;
        }
        * { box-sizing: border-box; }
        body { margin: 0; }
        .shell { display: grid; min-height: 100vh; padding: 20px; place-items: center; }
        .card { width: min(560px, 100%); padding: 34px; border: 1px solid #d7dde2; border-radius: 12px; background: white; box-shadow: 0 3px 14px rgb(35 52 66 / 9%); text-align: center; }
        .spinner { width: 42px; height: 42px; margin: 0 auto 20px; border: 5px solid #dce6df; border-top-color: #26734d; border-radius: 50%; animation: spin 0.9s linear infinite; }
        h1 { margin: 0 0 10px; font-size: 25px; }
        p { margin: 0 0 18px; color: #687681; line-height: 1.5; }
        a { color: #344b5e; font-weight: 700; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<main class="shell">
    <section class="card">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Generating your report</h1>
        <p>
            InvenTree is processing report job {{ output_id }}.
            This page checks automatically and will open the PDF when it is ready.
        </p>
        {% if total %}<p>Progress: {{ progress }} of {{ total }}</p>{% endif %}
        <a href="{{ control_panel_url }}">Return to Inventory Manager</a>
    </section>
</main>
</body>
</html>
